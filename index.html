<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ساهر - غزو الكائنات</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  body{background:#05060f;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-around;padding:8px 12px;font-size:16px;background:linear-gradient(to bottom,#000c,transparent);z-index:5;pointer-events:none}
  #hud span{color:#4ff;font-weight:bold;text-shadow:0 0 8px #4ff}
  #bossBar{position:fixed;top:45px;left:50%;transform:translateX(-50%);width:80%;max-width:600px;height:20px;background:#000a;border:2px solid #ff4f6b;border-radius:10px;overflow:hidden;z-index:5;box-shadow:0 0 15px #ff4f6b88;display:none}
  #bossBarFill{height:100%;width:100%;background:linear-gradient(90deg,#ff4f6b,#ffd84f);transition:width .15s}
  #bossBarLabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;text-shadow:0 0 5px #000}
  canvas{display:block;background:#0a0e1f;touch-action:none;cursor:crosshair}
  #overlay{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;z-index:10;padding:20px}
  #overlay h2{font-size:clamp(26px,6.5vw,42px);color:#ff4f6b;text-shadow:0 0 20px #ff4f6b}
  #overlay p{font-size:clamp(15px,3.5vw,19px);max-width:520px;line-height:1.7}
  button{padding:14px 36px;font-size:clamp(16px,4vw,20px);background:#4ff;border:none;border-radius:10px;cursor:pointer;font-weight:bold;transition:.2s;box-shadow:0 0 20px #44ffff88;color:#001}
  button:hover{background:#fff;transform:scale(1.05)}
  button:focus-visible{outline:3px solid #ffd84f;outline-offset:3px}
  #fsBtn,#muteBtn{position:fixed;top:8px;padding:6px 12px;font-size:18px;background:#ffffff22;color:#fff;border-radius:8px;cursor:pointer;z-index:6}
  #fsBtn{left:8px;border:1px solid #4ff;box-shadow:0 0 10px #44ffff88}
  #muteBtn{right:8px;border:1px solid #ffd84f;box-shadow:0 0 10px #ffd84f88}
  .hidden{display:none!important}
  #stageMsg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:7;opacity:0;transition:opacity .4s}
  #stageMsg.show{opacity:1}
  #stageMsg h2{font-size:clamp(34px,9vw,70px);color:#ffd84f;text-shadow:0 0 30px #ffd84f,0 0 60px #ff8c00;text-align:center;padding:0 20px}
  #stageMsg.boss h2{color:#ff4f6b;text-shadow:0 0 30px #ff4f6b,0 0 60px #f00}
</style>
</head>
<body>
<div id="hud">
  <div>المرحلة: <span id="stage">1</span></div>
  <div>النقاط: <span id="score">0</span></div>
  <div>الأرواح: <span id="lives">❤❤❤</span></div>
</div>
<div id="bossBar"><div id="bossBarFill"></div><div id="bossBarLabel">الوحش</div></div>
<button id="fsBtn" title="ملء الشاشة">⛶</button>
<button id="muteBtn" title="الصوت">🔊</button>
<canvas id="game"></canvas>
<div id="stageMsg"><h2></h2></div>
<div id="overlay">
  <h2>ساهر 🚀 غزو الكائنات</h2>
  <p>حرّك السفينة بالأسهم أو بالماوس أو باللمس<br>واضرب بالمسافة أو بكليك الماوس 💥<br>اهرب من الطلقات والبيض النازل! 🥚<br><br><b style="color:#ffd84f">كل 5 مراحل</b> هيظهرلك <b style="color:#ff4f6b">وحش ضخم</b> لازم تهزمه! 👹</p>
  <button id="startBtn">ابدأ المعركة</button>
</div>
<script>
(function(){
"use strict";

var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var scoreEl=document.getElementById('score');
var livesEl=document.getElementById('lives');
var stageEl=document.getElementById('stage');
var overlay=document.getElementById('overlay');
var overlayTitle=overlay.querySelector('h2');
var overlayText=overlay.querySelector('p');
var startBtn=document.getElementById('startBtn');
var fsBtn=document.getElementById('fsBtn');
var muteBtn=document.getElementById('muteBtn');
var stageMsg=document.getElementById('stageMsg');
var stageMsgH2=stageMsg.querySelector('h2');
var bossBar=document.getElementById('bossBar');
var bossBarFill=document.getElementById('bossBarFill');
var bossBarLabel=document.getElementById('bossBarLabel');

var W=0,H=0;
var player=null,keys={},bullets=[],enemies=[],enemyBullets=[],particles=[],stars=[];
var score=0,lives=3,stage=1,running=false,frame=0,shootCooldown=0,mouseX=0,shooting=false;
var boss=null,bossActive=false,stageTransition=null,screenShake=0;
var muted=false;
var loopStarted=false,lastTime=0,acc=0,STEP=1000/60;

/* ===== الصوت ===== */
var audioCtx=null,bgGain=null;
function initAudio(){
  if(audioCtx)return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    bgGain=audioCtx.createGain();
    bgGain.gain.value=muted?0:0.03;
    bgGain.connect(audioCtx.destination);
    var o1=audioCtx.createOscillator();o1.type='triangle';o1.frequency.value=110;
    var o2=audioCtx.createOscillator();o2.type='sine';o2.frequency.value=165;
    var lfo=audioCtx.createOscillator();lfo.frequency.value=0.25;
    var lfoG=audioCtx.createGain();lfoG.gain.value=8;
    lfo.connect(lfoG);lfoG.connect(o2.frequency);
    o1.connect(bgGain);o2.connect(bgGain);
    o1.start();o2.start();lfo.start();
  }catch(e){console.warn('audio init failed',e);}
}
function playSound(freq,dur,type,vol,slideTo){
  if(!audioCtx||muted)return;
  type=type||'square';vol=(vol==null)?0.08:vol;
  var t=audioCtx.currentTime;
  var osc=audioCtx.createOscillator();
  var g=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,t);
  if(slideTo!=null){try{osc.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t+dur);}catch(e){}}
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  osc.connect(g);g.connect(audioCtx.destination);
  osc.start(t);osc.stop(t+dur+0.02);
}
function sndShoot(){playSound(880,0.07,'square',0.04,600);}
function sndHit(){playSound(260,0.08,'sawtooth',0.06,180);}
function sndExplode(){playSound(140,0.30,'sawtooth',0.12,50);playSound(90,0.35,'square',0.08,40);}
function sndBossHit(){playSound(180,0.15,'square',0.09,120);}
function sndBossDie(){playSound(300,0.7,'sawtooth',0.15,40);playSound(120,0.9,'square',0.10,30);}
function sndLoseLife(){playSound(200,0.35,'sawtooth',0.15,80);}
function sndStageUp(){playSound(500,0.15,'triangle',0.08,900);setTimeout(function(){playSound(800,0.2,'triangle',0.08,1200);},120);}
function sndGameOver(){playSound(400,0.8,'sawtooth',0.15,80);}
function sndBossShot(){playSound(200,0.12,'square',0.05,120);}

muteBtn.addEventListener('click',function(){
  muted=!muted;
  muteBtn.textContent=muted?'🔇':'🔊';
  if(bgGain)bgGain.gain.value=muted?0:0.03;
  muteBtn.blur();
});
document.addEventListener('visibilitychange',function(){
  if(!audioCtx)return;
  if(document.hidden){audioCtx.suspend();}else{audioCtx.resume();}
});

/* ===== الإعداد ===== */
function makeStars(){
  stars=[];
  var n=Math.floor((W*H)/12000);
  for(var i=0;i<n;i++){stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+0.5,sp:Math.random()*0.5+0.2});}
}
function resizeCanvas(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  if(player){player.y=H-100;player.x=Math.min(player.x,W-player.w);}
  makeStars();
}
window.addEventListener('resize',resizeCanvas);
window.addEventListener('orientationchange',function(){setTimeout(resizeCanvas,200);});

function initGame(){
  player={x:W/2-22,y:H-100,w:44,h:44,speed:7,invuln:0};
  keys={};bullets=[];enemies=[];enemyBullets=[];particles=[];
  boss=null;bossActive=false;stageTransition=null;screenShake=0;
  makeStars();
  score=0;lives=3;stage=1;running=true;frame=0;shootCooldown=0;mouseX=W/2;shooting=false;
  updateHUD();bossBar.style.display='none';
}
function updateHUD(){
  scoreEl.textContent=score;
  livesEl.textContent=lives>0?Array(lives+1).join('❤'):'—';
  stageEl.textContent=stage;
}

if(!document.documentElement.requestFullscreen){fsBtn.style.display='none';}
fsBtn.addEventListener('click',function(){
  if(!document.fullscreenElement){if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}
  else{if(document.exitFullscreen)document.exitFullscreen();}
  fsBtn.blur();
});

function normKey(k){return k.length===1?k.toLowerCase():k;}
document.addEventListener('keydown',function(e){
  var k=normKey(e.key);
  keys[k]=true;
  if(k===' '||k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'){
    if(running)e.preventDefault();
  }
});
document.addEventListener('keyup',function(e){keys[normKey(e.key)]=false;});
window.addEventListener('blur',function(){keys={};shooting=false;});

function pointerX(clientX){
  var r=canvas.getBoundingClientRect();
  return (clientX-r.left)*(W/r.width);
}
canvas.addEventListener('mousemove',function(e){mouseX=pointerX(e.clientX);});
canvas.addEventListener('mousedown',function(e){shooting=true;mouseX=pointerX(e.clientX);});
document.addEventListener('mouseup',function(){shooting=false;});
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
canvas.addEventListener('touchstart',function(e){e.preventDefault();shooting=true;mouseX=pointerX(e.touches[0].clientX);},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();mouseX=pointerX(e.touches[0].clientX);},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();if(e.touches.length===0)shooting=false;},{passive:false});
canvas.addEventListener('touchcancel',function(){shooting=false;});

/* ===== مراحل ===== */
function isBossStage(s){return s%5===0;}

function startStage(s){
  stage=s;updateHUD();
  enemies=[];enemyBullets=[];boss=null;bossActive=false;bossBar.style.display='none';
  if(isBossStage(s)){
    spawnBoss();
    showStageMessage('👹 وحش المرحلة '+s+'!',true);
    playSound(120,0.6,'sawtooth',0.12,60);
  }else{
    spawnWave();
    showStageMessage('المرحلة '+s,false);
    sndStageUp();
  }
}
function spawnWave(){
  var maxCols=Math.max(4,Math.floor(W/80));
  var d=(stage%5===4)?5:stage;
  var rows=Math.min(2+Math.floor(d/2),4);
  var cols=Math.min(5+Math.floor(d/3),maxCols,10);
  var spacing=Math.min(70,(W-60)/cols);
  var startX=(W-cols*spacing)/2+(spacing-44)/2;
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var strong=(r===0&&d>=4);
      enemies.push({
        x:startX+c*spacing,y:90+r*60,w:44,h:44,
        hp:strong?2:1,maxHp:strong?2:1,
        speed:1+d*0.15,dir:1,
        shootTimer:60+Math.random()*120,
        type:strong?'strong':'normal',
        wobble:Math.random()*Math.PI*2
      });
    }
  }
}
function spawnBoss(){
  var bn=Math.floor(stage/5);
  var mh=20+(bn-1)*15;
  boss={x:W/2-70,y:90,w:140,h:110,hp:mh,maxHp:mh,dir:1,speed:1.2+bn*0.4,shootTimer:60,pattern:0,wobble:0,bossNum:bn,hitFlash:0};
  bossActive=true;bossBar.style.display='block';updateBossBar();
}
function updateBossBar(){
  if(!boss)return;
  bossBarFill.style.width=Math.max(0,(boss.hp/boss.maxHp)*100)+'%';
  bossBarLabel.textContent='👹 وحش المرحلة '+stage+' — '+boss.hp+'/'+boss.maxHp;
}
function showStageMessage(t,isBoss){
  stageMsgH2.textContent=t;
  if(isBoss)stageMsg.classList.add('boss');else stageMsg.classList.remove('boss');
  stageMsg.classList.add('show');
  clearTimeout(showStageMessage._t);
  showStageMessage._t=setTimeout(function(){stageMsg.classList.remove('show');},1500);
}

/* ===== الطلقات ===== */
function shoot(){
  if(shootCooldown>0)return;
  bullets.push({x:player.x+player.w/2-2,y:player.y,w:4,h:14,speed:12});
  shootCooldown=8;sndShoot();
}
function enemyShoot(e){
  enemyBullets.push({x:e.x+e.w/2-4,y:e.y+e.h,w:8,h:12,vy:3+Math.min(stage,6)*0.25,vx:0,type:'egg'});
}
function bossShoot(b){
  var cx=b.x+b.w/2,cy=b.y+b.h,i,a,dx,dy,len,sp,n;
  if(b.pattern===0){
    for(i=-1;i<=1;i++){enemyBullets.push({x:cx+i*40-4,y:cy,w:10,h:14,vy:4+b.bossNum*0.3,vx:0,color:'#ff4f6b',type:'boss'});}
  }else if(b.pattern===1){
    dx=(player.x+player.w/2)-cx;dy=(player.y+player.h/2)-cy;
    len=Math.hypot(dx,dy)||1;sp=4.5+b.bossNum*0.3;
    enemyBullets.push({x:cx-5,y:cy,w:12,h:12,vx:(dx/len)*sp,vy:(dy/len)*sp,color:'#ffd84f',type:'boss'});
  }else if(b.pattern===2){
    for(i=-2;i<=2;i++){
      a=Math.PI/2+i*0.35;sp=3.8+b.bossNum*0.25;
      enemyBullets.push({x:cx-5,y:cy,w:10,h:10,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,color:'#ff7f4f',type:'boss'});
    }
  }else if(b.pattern===3&&b.bossNum>=2){
    n=12;
    for(i=0;i<n;i++){
      a=(i/n)*Math.PI*2;sp=3.2+b.bossNum*0.2;
      enemyBullets.push({x:cx-5,y:cy-5,w:10,h:10,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,color:'#ff4f9f',type:'boss'});
    }
  }
  sndBossShot();
}
function explode(x,y,c,n,f){
  n=n||20;f=f||1;
  for(var i=0;i<n;i++){
    particles.push({x:x,y:y,vx:(Math.random()-0.5)*7*f,vy:(Math.random()-0.5)*7*f,life:30+Math.random()*20,maxLife:50,color:c,size:Math.random()*4+2});
  }
}
function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

/* ===== التحديث ===== */
function update(){
  if(!running)return;
  frame++;
  if(shootCooldown>0)shootCooldown--;
  if(player.invuln>0)player.invuln--;
  if(screenShake>0.1)screenShake*=0.9;else screenShake=0;

  for(var si=0;si<stars.length;si++){
    var st=stars[si];st.y+=st.sp;
    if(st.y>H){st.y=0;st.x=Math.random()*W;}
  }

  var usingKeys=(keys['ArrowLeft']||keys['ArrowRight']||keys['a']||keys['d']);
  if(keys['ArrowLeft']||keys['a'])player.x-=player.speed;
  if(keys['ArrowRight']||keys['d'])player.x+=player.speed;
  if(usingKeys)mouseX=player.x+player.w/2;
  else player.x=mouseX-player.w/2;
  player.x=Math.max(0,Math.min(W-player.w,player.x));

  if(keys[' ']||shooting)shoot();

  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];b.y-=b.speed;
    if(b.y+b.h<0)bullets.splice(i,1);
  }

  if(bossActive&&boss){
    if(boss.hitFlash>0)boss.hitFlash--;
    boss.x+=boss.speed*boss.dir;boss.wobble+=0.06;
    if(boss.x<=10)boss.dir=1;
    if(boss.x+boss.w>=W-10)boss.dir=-1;
    boss.y=90+Math.sin(boss.wobble)*25;
    boss.shootTimer--;
    if(boss.shootTimer<=0){
      bossShoot(boss);
      boss.pattern=(boss.pattern+1)%(boss.bossNum>=2?4:3);
      boss.shootTimer=Math.max(45,110-boss.bossNum*12);
    }
    for(var i2=bullets.length-1;i2>=0;i2--){
      var bb=bullets[i2];
      if(collide(bb,boss)){
        bullets.splice(i2,1);boss.hp--;boss.hitFlash=4;updateBossBar();
        explode(bb.x,bb.y,'#ffd84f',6);sndBossHit();
        if(boss.hp<=0){
          explode(boss.x+boss.w/2,boss.y+boss.h/2,'#ff4f6b',80,1.6);
          explode(boss.x+boss.w/2,boss.y+boss.h/2,'#ffd84f',60,1.2);
          sndBossDie();
          score+=100+boss.bossNum*50;
          bossActive=false;boss=null;bossBar.style.display='none';
          enemyBullets=[];
          screenShake=20;
          showStageMessage('🎉 هزمت الوحش!',false);
          scheduleNextStage();
          updateHUD();
          break;
        }
      }
    }
    if(bossActive&&boss&&collide(boss,player)&&player.invuln<=0){
      explode(player.x+player.w/2,player.y+player.h/2,'#4ff',30);loseLife();
    }
  }

  if(!bossActive){
    var leftHit=false,rightHit=false;
    for(var ei=0;ei<enemies.length;ei++){
      var en=enemies[ei];
      en.x+=en.speed*en.dir;en.wobble+=0.08;
      if(en.x<=10)leftHit=true;
      if(en.x+en.w>=W-10)rightHit=true;
    }
    if(leftHit||rightHit){
      var newDir=leftHit?1:-1;
      for(var ej=0;ej<enemies.length;ej++){enemies[ej].dir=newDir;enemies[ej].y+=20;}
    }

    for(var ek=0;ek<enemies.length;ek++){
      var em=enemies[ek];
      em.shootTimer--;
      if(em.shootTimer<=0&&em.y>40){
        enemyShoot(em);
        em.shootTimer=Math.max(40,180-stage*10)+Math.random()*90;
      }
    }

    for(var bi=bullets.length-1;bi>=0;bi--){
      var bu=bullets[bi];
      for(var ji=enemies.length-1;ji>=0;ji--){
        var en2=enemies[ji];
        if(collide(bu,en2)){
          bullets.splice(bi,1);en2.hp--;explode(bu.x,bu.y,'#ffd84f',8);sndHit();
          if(en2.hp<=0){
            explode(en2.x+en2.w/2,en2.y+en2.h/2,en2.type==='strong'?'#ff4f6b':'#7cff4f',25);
            enemies.splice(ji,1);
            score+=en2.type==='strong'?20:10;updateHUD();sndExplode();
          }else{score+=2;updateHUD();}
          break;
        }
      }
    }

    for(var mi=enemies.length-1;mi>=0;mi--){
      var mo=enemies[mi];
      if(collide(mo,player)&&player.invuln<=0){
        explode(player.x+player.w/2,player.y+player.h/2,'#4ff',30);
        explode(mo.x+mo.w/2,mo.y+mo.h/2,'#ff4f6b',20);
        enemies.splice(mi,1);loseLife();continue;
      }
      if(mo.y+mo.h>H-40){
        explode(mo.x+mo.w/2,mo.y+mo.h/2,'#ff4f6b',20);
        enemies.splice(mi,1);loseLife();
      }
    }
  }

  for(var ebi=enemyBullets.length-1;ebi>=0;ebi--){
    var eb=enemyBullets[ebi];eb.y+=eb.vy;eb.x+=eb.vx;
    if(eb.y>H+20||eb.y<-20||eb.x<-20||eb.x>W+20){enemyBullets.splice(ebi,1);continue;}
    if(player.invuln<=0&&collide(eb,player)){
      enemyBullets.splice(ebi,1);
      explode(player.x+player.w/2,player.y+player.h/2,'#4ff',30);
      loseLife();
    }
  }

  for(var pi=particles.length-1;pi>=0;pi--){
    var pa=particles[pi];pa.x+=pa.vx;pa.y+=pa.vy;pa.vy+=0.15;pa.vx*=0.98;pa.life--;
    if(pa.life<=0)particles.splice(pi,1);
  }

  if(!running)return;

  if(stageTransition){
    stageTransition.timer--;
    if(stageTransition.timer<=0){
      var tt=stageTransition;stageTransition=null;startStage(tt.nextStage);
    }
  }else if(!bossActive&&enemies.length===0&&running){
    scheduleNextStage();
  }
}
function scheduleNextStage(){
  if(stageTransition)return;
  stageTransition={timer:90,nextStage:stage+1};
  if(stage%5===0){lives=Math.min(lives+1,5);updateHUD();}
}
function loseLife(){
  if(player.invuln>0)return;
  lives--;updateHUD();player.invuln=90;screenShake=15;sndLoseLife();
  if(lives<=0)gameOver();
}
function gameOver(){
  running=false;shooting=false;
  sndGameOver();
  bossBar.style.display='none';
  stageMsg.classList.remove('show');
  overlayTitle.textContent='انتهت اللعبة 💀';
  overlayText.innerHTML='وصلت للمرحلة <b style="color:#ffd84f">'+stage+'</b><br>ونقاطك: <b style="color:#4ff">'+score+'</b><br><br>عايز تجرّب تاني؟';
  startBtn.textContent='العب تاني';
  overlay.classList.remove('hidden');
}

/* ===== الرسم ===== */
function drawShip(x,y){
  if(player.invuln>0&&Math.floor(frame/4)%2===0)return;
  ctx.save();
  ctx.shadowBlur=20;ctx.shadowColor='#4ff';
  var grd=ctx.createLinearGradient(x,y,x,y+player.h);
  grd.addColorStop(0,'#aaffff');grd.addColorStop(1,'#0088aa');
  ctx.fillStyle=grd;
  ctx.beginPath();
  ctx.moveTo(x+player.w/2,y);
  ctx.lineTo(x+player.w,y+player.h);
  ctx.lineTo(x+player.w/2,y+player.h-8);
  ctx.lineTo(x,y+player.h);
  ctx.closePath();ctx.fill();

  ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+player.w/2,y+14,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4ff';ctx.beginPath();ctx.arc(x+player.w/2,y+14,3,0,Math.PI*2);ctx.fill();

  var fl=8+Math.sin(frame*0.5)*4;
  ctx.fillStyle='#ffd84f';
  ctx.beginPath();ctx.moveTo(x+10,y+player.h);ctx.lineTo(x+player.w/2,y+player.h+fl);ctx.lineTo(x+player.w-10,y+player.h);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff7f4f';
  ctx.beginPath();ctx.moveTo(x+16,y+player.h);ctx.lineTo(x+player.w/2,y+player.h+fl*0.6);ctx.lineTo(x+player.w-16,y+player.h);ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawEnemy(e){
  ctx.save();
  ctx.translate(e.x+e.w/2,e.y+e.h/2+Math.sin(e.wobble)*3);
  var isStrong=(e.type==='strong');
  var col=isStrong?'#ff4f6b':'#7cff4f';
  var col2=isStrong?'#8b0030':'#1e7a1a';

  ctx.shadowBlur=18;ctx.shadowColor=col;

  ctx.fillStyle=col2;
  ctx.beginPath();ctx.ellipse(0,0,e.w/2,e.h/2,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle=col;
  ctx.beginPath();ctx.ellipse(0,-3,e.w/2.4,e.h/2.6,0,0,Math.PI*2);ctx.fill();

  ctx.beginPath();ctx.moveTo(-e.w/2.8,-e.h/2.6);ctx.lineTo(-e.w/3.2,-e.h/2-6);ctx.lineTo(-e.w/5,-e.h/3);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(e.w/2.8,-e.h/2.6);ctx.lineTo(e.w/3.2,-e.h/2-6);ctx.lineTo(e.w/5,-e.h/3);ctx.closePath();ctx.fill();

  ctx.shadowBlur=10;ctx.shadowColor='#ffd84f';
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-8,-4,5.5,0,Math.PI*2);ctx.arc(8,-4,5.5,0,Math.PI*2);ctx.fill();

  ctx.shadowBlur=0;
  ctx.fillStyle=isStrong?'#ff0040':'#003300';
  var px=Math.sin(e.wobble)*1.5;
  ctx.beginPath();ctx.arc(-8+px,-4,2.8,0,Math.PI*2);ctx.arc(8+px,-4,2.8,0,Math.PI*2);ctx.fill();

  ctx.strokeStyle='#000';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,4,6,0,Math.PI);ctx.stroke();
  ctx.fillStyle='#000';
  for(var i=-2;i<=2;i++){
    ctx.beginPath();
    ctx.moveTo(i*2.5-1,6);ctx.lineTo(i*2.5,10);ctx.lineTo(i*2.5+1,6);
    ctx.closePath();ctx.fill();
  }

  if(e.maxHp>1){
    ctx.fillStyle='#0008';ctx.fillRect(-e.w/2,-e.h/2-8,e.w,4);
    ctx.fillStyle='#ffd84f';ctx.fillRect(-e.w/2,-e.h/2-8,e.w*(e.hp/e.maxHp),4);
  }
  ctx.restore();
}

function drawBoss(b){
  ctx.save();
  ctx.translate(b.x+b.w/2,b.y+b.h/2);
  var pulse=1+Math.sin(b.wobble*3)*0.04;
  ctx.scale(pulse,pulse);

  ctx.shadowBlur=35;ctx.shadowColor='#ff0040';
  ctx.fillStyle=b.hitFlash>0?'#ff6f8f':'#8b0030';
  ctx.beginPath();
  for(var i=0;i<12;i++){
    var r=(i%2===0)?b.w/2:b.w/2.8;
    var a=(i/12)*Math.PI*2-Math.PI/2;
    ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
  }
  ctx.closePath();ctx.fill();

  ctx.fillStyle=b.hitFlash>0?'#ffffff':'#ff4f6b';
  ctx.beginPath();ctx.ellipse(0,-5,b.w/3,b.h/3,0,0,Math.PI*2);ctx.fill();

  /* القرون */
  ctx.fillStyle='#ffd84f';
  ctx.beginPath();ctx.moveTo(-b.w/3,-b.h/3);ctx.lineTo(-b.w/2.5,-b.h/2-20);ctx.lineTo(-b.w/4,-b.h/4);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(b.w/3,-b.h/3);ctx.lineTo(b.w/2.5,-b.h/2-20);ctx.lineTo(b.w/4,-b.h/4);ctx.closePath();ctx.fill();

  /* العيون */
  ctx.shadowBlur=15;ctx.shadowColor='#ffd84f';
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-b.w/8,-b.h/8,11,0,Math.PI*2);ctx.arc(b.w/8,-b.h/8,11,0,Math.PI*2);ctx.fill();

  ctx.shadowBlur=0;
  var tx=0,ty=0;
  if(player){
    var ddx=(player.x+player.w/2)-(b.x+b.w/2);
    var ddy=(player.y+player.h/2)-(b.y+b.h/2);
    var dl=Math.hypot(ddx,ddy)||1;
    tx=(ddx/dl)*4;ty=(ddy/dl)*4;
  }
  ctx.fillStyle='#ff0040';
  ctx.beginPath();ctx.arc(-b.w/8+tx,-b.h/8+ty,5,0,Math.PI*2);ctx.arc(b.w/8+tx,-b.h/8+ty,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(-b.w/8+tx,-b.h/8+ty,2.2,0,Math.PI*2);ctx.arc(b.w/8+tx,-b.h/8+ty,2.2,0,Math.PI*2);ctx.fill();

  /* الحواجب الغاضبة */
  ctx.strokeStyle='#3a0010';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-b.w/8-14,-b.h/8-16);ctx.lineTo(-b.w/8+10,-b.h/8-9);
  ctx.moveTo(b.w/8+14,-b.h/8-16);ctx.lineTo(b.w/8-10,-b.h/8-9);
  ctx.stroke();

  /* الفم والأسنان */
  var mouthOpen=6+Math.abs(Math.sin(b.wobble*2))*8;
  ctx.fillStyle='#1a0008';
  ctx.beginPath();
  ctx.moveTo(-b.w/5,b.h/8);
  ctx.quadraticCurveTo(0,b.h/8+mouthOpen*2.4,b.w/5,b.h/8);
  ctx.closePath();ctx.fill();

  ctx.fillStyle='#fff';
  for(var t=-3;t<=3;t++){
    var tx2=t*(b.w/5/3.4);
    ctx.beginPath();
    ctx.moveTo(tx2-4,b.h/8+1);ctx.lineTo(tx2,b.h/8+9);ctx.lineTo(tx2+4,b.h/8+1);
    ctx.closePath();ctx.fill();
  }

  /* الشوك على الأطراف */
  ctx.fillStyle='#ffd84f';
  for(var s=0;s<2;s++){
    var sign=s===0?-1:1;
    ctx.beginPath();
    ctx.moveTo(sign*b.w/2.2,-4);ctx.lineTo(sign*(b.w/2+14),6);ctx.lineTo(sign*b.w/2.2,16);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

function drawBackground(){
  ctx.fillStyle='#0a0e1f';
  ctx.fillRect(-30,-30,W+60,H+60);
  var g=ctx.createRadialGradient(W/2,H*0.85,10,W/2,H*0.85,Math.max(W,H)*0.8);
  g.addColorStop(0,'rgba(30,60,120,0.35)');
  g.addColorStop(1,'rgba(10,14,31,0)');
  ctx.fillStyle=g;
  ctx.fillRect(-30,-30,W+60,H+60);
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=0.4+s.sp*0.9;
    ctx.fillStyle='#fff';
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(screenShake>0){
    ctx.translate((Math.random()-0.5)*screenShake,(Math.random()-0.5)*screenShake);
  }
  drawBackground();
  if(!player){ctx.restore();return;}

  /* الجزيئات */
  for(var pi=0;pi<particles.length;pi++){
    var pa=particles[pi];
    ctx.globalAlpha=Math.max(0,pa.life/pa.maxLife);
    ctx.fillStyle=pa.color;
    ctx.fillRect(pa.x,pa.y,pa.size,pa.size);
  }
  ctx.globalAlpha=1;

  /* طلقات اللاعب */
  ctx.save();
  ctx.shadowBlur=12;ctx.shadowColor='#4ff';
  ctx.fillStyle='#aaffff';
  for(var bi=0;bi<bullets.length;bi++){
    var bu=bullets[bi];
    ctx.fillRect(bu.x,bu.y,bu.w,bu.h);
  }
  ctx.restore();

  /* طلقات الأعداء */
  for(var ei=0;ei<enemyBullets.length;ei++){
    var eb=enemyBullets[ei];
    ctx.save();
    if(eb.type==='egg'){
      ctx.shadowBlur=10;ctx.shadowColor='#ffd84f';
      ctx.fillStyle='#fff6d6';
      ctx.beginPath();ctx.ellipse(eb.x+eb.w/2,eb.y+eb.h/2,eb.w/2,eb.h/2,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffd84f';
      ctx.beginPath();ctx.ellipse(eb.x+eb.w/2,eb.y+eb.h/2+1,eb.w/4,eb.h/4,0,0,Math.PI*2);ctx.fill();
    }else{
      ctx.shadowBlur=15;ctx.shadowColor=eb.color;
      ctx.fillStyle=eb.color;
      ctx.beginPath();ctx.arc(eb.x+eb.w/2,eb.y+eb.h/2,Math.max(eb.w,eb.h)/2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(eb.x+eb.w/2,eb.y+eb.h/2,Math.max(eb.w,eb.h)/5,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  /* الأعداء والوحش */
  for(var ci=0;ci<enemies.length;ci++)drawEnemy(enemies[ci]);
  if(bossActive&&boss)drawBoss(boss);

  /* السفينة */
  if(running)drawShip(player.x,player.y);

  ctx.restore();
}

/* ===== الحلقة الرئيسية ===== */
function loop(t){
  if(!lastTime)lastTime=t;
  acc+=Math.min(100,t-lastTime);
  lastTime=t;
  while(acc>=STEP){update();acc-=STEP;}
  draw();
  requestAnimationFrame(loop);
}

/* ===== البدء ===== */
startBtn.addEventListener('click',function(){
  initAudio();
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  startBtn.blur();
  overlay.classList.add('hidden');
  initGame();
  startStage(1);
  lastTime=0;acc=0;
});

resizeCanvas();
if(!loopStarted){loopStarted=true;requestAnimationFrame(loop);}

})();
</script>
