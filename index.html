<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title> ساهر غزو الكائنات</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  body{background:#05060f;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-around;padding:8px 12px;font-size:16px;background:linear-gradient(to bottom,#000c,transparent);z-index:5;pointer-events:none}
  #hud span{color:#4ff;font-weight:bold;text-shadow:0 0 8px #4ff}
  #bossBar{position:fixed;top:45px;left:50%;transform:translateX(-50%);width:80%;max-width:600px;height:20px;background:#000a;border:2px solid #ff4f6b;border-radius:10px;overflow:hidden;z-index:5;box-shadow:0 0 15px #ff4f6b8;display:none}
  #bossBarFill{height:100%;width:100%;background:linear-gradient(90deg,#ff4f6b,#ffd84f);transition:width .15s}
  #bossBarLabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;text-shadow:0 0 5px #000}
  canvas{display:block;background:#0a0e1f;touch-action:none;cursor:crosshair}
  #overlay{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;z-index:10;padding:20px}
  #overlay h2{font-size:clamp(26px,6.5vw,42px);color:#ff4f6b;text-shadow:0 0 20px #ff4f6b}
  #overlay p{font-size:clamp(15px,3.5vw,19px);max-width:520px;line-height:1.7}
  button{padding:14px 36px;font-size:clamp(16px,4vw,20px);background:#4ff;border:none;border-radius:10px;cursor:pointer;font-weight:bold;transition:.2s;box-shadow:0 0 20px #4ff8}
  button:hover{background:#fff;transform:scale(1.05)}
  #fsBtn{position:fixed;top:8px;left:8px;padding:6px 12px;font-size:18px;background:#ffffff22;color:#fff;border:1px solid #4ff;border-radius:8px;cursor:pointer;z-index:6;box-shadow:0 0 10px #4ff8}
  .hidden{display:none!important}
  #stageMsg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:7;opacity:0;transition:opacity .4s}
  #stageMsg.show{opacity:1}
  #stageMsg h2{font-size:clamp(34px,9vw,70px);color:#ffd84f;text-shadow:0 0 30px #ffd84f,0 0 60px #ff8c00;text-align:center;padding:0 20px}
  #stageMsg.boss h2{color:#ff4f6b;text-shadow:0 0 30px #ff4f6b,0 0 60px #f00}
</style>
</head>
<body>
<div id="hud">
  <div>المرحلة: <span id="stage">1</span></div>
  <div>النقاط: <span id="score">0</span></div>
  <div>الأرواح: <span id="lives">❤❤❤</span></div>
</div>
<div id="bossBar"><div id="bossBarFill"></div><div id="bossBarLabel">👹 الوحش</div></div>
<button id="fsBtn" title="ملء الشاشة">⛶</button>
<canvas id="game"></canvas>
<div id="stageMsg"><h2></h2></div>
<div id="overlay">
  <h2>🚀  ساهر غزو الكائنات</h2>
  <p>حرّك السفينة بالأسهم أو بالماوس أو باللمس<br>واضرب بالمسافة أو بكليك الماوس 💥<br>اهرب من الطلقات والبيض النازل! 🥚<br><br><b style="color:#ffd84f">كل 5 مراحل</b> هيظهرلك <b style="color:#ff4f6b">وحش ضخم</b> لازم تهزمه! 👹</p>
  <button id="startBtn">ابدأ المعركة</button>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),stageEl=document.getElementById('stage');
const overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),fsBtn=document.getElementById('fsBtn');
const stageMsg=document.getElementById('stageMsg'),stageMsgH2=stageMsg.querySelector('h2');
const bossBar=document.getElementById('bossBar'),bossBarFill=document.getElementById('bossBarFill'),bossBarLabel=document.getElementById('bossBarLabel');
let W,H,player,keys,bullets,enemies,enemyBullets,particles,stars;
let score,lives,stage,running,frame,shootCooldown,mouseX,shooting=false;
let boss,bossActive,stageTransition,screenShake=0;

function resizeCanvas(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;if(player){player.y=H-100;player.x=Math.min(player.x,W-player.w)}}
window.addEventListener('resize',resizeCanvas);
window.addEventListener('orientationchange',()=>setTimeout(resizeCanvas,200));

function initGame(){
  player={x:W/2-22,y:H-100,w:44,h:44,speed:7,invuln:0};
  keys={};bullets=[];enemies=[];enemyBullets=[];particles=[];stars=[];
  boss=null;bossActive=false;stageTransition=null;screenShake=0;
  const n=Math.floor((W*H)/12000);
  for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.5,sp:Math.random()*.5+.2});
  score=0;lives=3;stage=1;running=true;frame=0;shootCooldown=0;mouseX=W/2;
  updateHUD();bossBar.style.display='none';
}
function updateHUD(){scoreEl.textContent=score;livesEl.textContent='❤'.repeat(Math.max(0,lives))||'—';stageEl.textContent=stage}

fsBtn.addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});

document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')e.preventDefault()});
document.addEventListener('keyup',e=>keys[e.key]=false);
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouseX=(e.clientX-r.left)*(W/r.width)});
canvas.addEventListener('mousedown',()=>shooting=true);
document.addEventListener('mouseup',()=>shooting=false);
canvas.addEventListener('touchstart',e=>{e.preventDefault();shooting=true;const r=canvas.getBoundingClientRect();mouseX=(e.touches[0].clientX-r.left)*(W/r.width)},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();mouseX=(e.touches[0].clientX-r.left)*(W/r.width)},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();shooting=false},{passive:false});

function isBossStage(s){return s%5===0}
function startStage(s){
  stage=s;updateHUD();enemies=[];enemyBullets=[];boss=null;bossActive=false;bossBar.style.display='none';
  if(isBossStage(s)){spawnBoss();showStageMessage('👹 وحش المرحلة '+s+'!',true)}
  else{spawnWave();showStageMessage('المرحلة '+s,false)}
}
function spawnWave(){
  const maxCols=Math.max(4,Math.floor(W/80));
  const d=stage%5===4?5:stage;
  const rows=Math.min(2+Math.floor(d/2),4);
  const cols=Math.min(5+Math.floor(d/3),maxCols,10);
  const spacing=Math.min(70,(W-60)/cols);
  const startX=(W-cols*spacing)/2+(spacing-44)/2;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    enemies.push({x:startX+c*spacing,y:90+r*60,w:44,h:44,hp:d>=4&&r===0?2:1,maxHp:d>=4&&r===0?2:1,speed:1+d*.15,dir:1,shootTimer:60+Math.random()*120,type:r===0&&d>=4?'strong':'normal',wobble:Math.random()*Math.PI*2});
  }
}
function spawnBoss(){
  const bn=Math.floor(stage/5);const mh=20+(bn-1)*15;
  boss={x:W/2-70,y:90,w:140,h:110,hp:mh,maxHp:mh,dir:1,speed:1.2+bn*.4,shootTimer:60,pattern:0,wobble:0,bossNum:bn};
  bossActive=true;bossBar.style.display='block';updateBossBar();
}
function updateBossBar(){if(!boss)return;bossBarFill.style.width=Math.max(0,(boss.hp/boss.maxHp)*100)+'%';bossBarLabel.textContent='👹 وحش المرحلة '+stage+' — '+boss.hp+'/'+boss.maxHp}
function showStageMessage(t,isBoss){stageMsgH2.textContent=t;stageMsg.classList.toggle('boss',!!isBoss);stageMsg.classList.add('show');clearTimeout(showStageMessage._t);showStageMessage._t=setTimeout(()=>stageMsg.classList.remove('show'),1500)}

function shoot(){if(shootCooldown>0)return;bullets.push({x:player.x+player.w/2-2,y:player.y,w:4,h:14,speed:12});shootCooldown=8}
function enemyShoot(e){enemyBullets.push({x:e.x+e.w/2-4,y:e.y+e.h,w:8,h:12,vy:3+Math.min(stage,6)*.25,vx:0,type:'egg'})}
function bossShoot(b){
  const cx=b.x+b.w/2,cy=b.y+b.h;
  if(b.pattern===0){for(let i=-1;i<=1;i++)enemyBullets.push({x:cx+i*40-4,y:cy,w:10,h:14,vy:4+b.bossNum*.3,vx:0,color:'#ff4f6b',type:'boss'})}
  else if(b.pattern===1){const dx=(player.x+player.w/2)-cx,dy=(player.y+player.h/2)-cy,len=Math.hypot(dx,dy)||1,sp=4.5+b.bossNum*.3;enemyBullets.push({x:cx-5,y:cy,w:12,h:12,vx:(dx/len)*sp,vy:(dy/len)*sp,color:'#ffd84f',type:'boss'})}
  else if(b.pattern===2){for(let i=-2;i<=2;i++){const a=Math.PI/2+i*.35,sp=3.8+b.bossNum*.25;enemyBullets.push({x:cx-5,y:cy,w:10,h:10,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,color:'#ff7f4f',type:'boss'})}}
  else if(b.pattern===3&&b.bossNum>=2){const n=12;for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2,sp=3.2+b.bossNum*.2;enemyBullets.push({x:cx-5,y:cy-5,w:10,h:10,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,color:'#ff4f9f',type:'boss'})}}
}
function explode(x,y,c,n=20,f=1){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*7*f,vy:(Math.random()-.5)*7*f,life:30+Math.random()*20,maxLife:50,color:c,size:Math.random()*4+2})}
function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(){
  if(!running)return;frame++;
  if(shootCooldown>0)shootCooldown--;
  if(player.invuln>0)player.invuln--;
  if(screenShake>0)screenShake*=.9;
  stars.forEach(s=>{s.y+=s.sp;if(s.y>H){s.y=0;s.x=Math.random()*W}});
  if(keys['ArrowLeft']||keys['a'])player.x-=player.speed;
  if(keys['ArrowRight']||keys['d'])player.x+=player.speed;
  if(keys['ArrowLeft']||keys['ArrowRight'])mouseX=player.x+player.w/2;
  else player.x=mouseX-player.w/2;
  player.x=Math.max(0,Math.min(W-player.w,player.x));
  if(keys[' ']||shooting)shoot();
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.y-=b.speed;if(b.y+b.h<0)bullets.splice(i,1)}

  if(bossActive&&boss){
    boss.x+=boss.speed*boss.dir;boss.wobble+=.06;
    if(boss.x<=10)boss.dir=1;if(boss.x+boss.w>=W-10)boss.dir=-1;
    boss.y=90+Math.sin(boss.wobble)*25;
    boss.shootTimer--;
    if(boss.shootTimer<=0){bossShoot(boss);boss.pattern=(boss.pattern+1)%(boss.bossNum>=2?4:3);boss.shootTimer=Math.max(45,110-boss.bossNum*12)}
    for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];if(collide(b,boss)){bullets.splice(i,1);boss.hp--;updateBossBar();explode(b.x,b.y,'#ffd84f',6);
      if(boss.hp<=0){explode(boss.x+boss.w/2,boss.y+boss.h/2,'#ff4f6b',80,1.6);explode(boss.x+boss.w/2,boss.y+boss.h/2,'#ffd84f',60,1.2);
        score+=100+boss.bossNum*50;updateHUD();bossActive=false;boss=null;bossBar.style.display='none';screenShake=20;scheduleNextStage()}}}
    if(bossActive&&boss&&collide(boss,player)&&player.invuln<=0){explode(player.x+player.w/2,player.y+player.h/2,'#4ff',30);loseLife()}
  }

  if(!bossActive){
    let edgeHit=false;
    enemies.forEach(e=>{e.x+=e.speed*e.dir;e.wobble+=.08;if(e.x<=10||e.x+e.w>=W-10)edgeHit=true});
    if(edgeHit)enemies.forEach(e=>{e.dir*=-1;e.y+=20});
    enemies.forEach(e=>{e.shootTimer--;if(e.shootTimer<=0&&e.y>40){enemyShoot(e);e.shootTimer=Math.max(40,180-stage*10)+Math.random()*90}});
    for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(collide(b,e)){bullets.splice(i,1);e.hp--;explode(b.x,b.y,'#ffd84f',8);
      if(e.hp<=0){explode(e.x+e.w/2,e.y+e.h/2,e.type==='strong'?'#ff4f6b':'#7cff4f',25);enemies.splice(j,1);score+=e.type==='strong'?20:10;updateHUD()}
      else{score+=2;updateHUD()}break}}}
    for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];
      if(collide(e,player)&&player.invuln<=0){explode(player.x+player.w/2,player.y+player.h/2,'#4ff',30);explode(e.x+e.w/2,e.y+e.h/2,'#ff4f6b',20);enemies.splice(i,1);loseLife();continue}
      if(e.y+e.h>H-40){explode(e.x+e.w/2,e.y+e.h/2,'#ff4f6b',20);enemies.splice(i,1);loseLife()}}
  }

  for(let i=enemyBullets.length-1;i>=0;i--){const b=enemyBullets[i];b.y+=b.vy;b.x+=b.vx;
    if(b.y>H+20||b.y<-20||b.x<-20||b.x>W+20){enemyBullets.splice(i,1);continue}
    if(player.invuln<=0&&collide(b,player)){enemyBullets.splice(i,1);explode(player.x+player.w/2,player.y+player.h/2,'#4ff',30);loseLife()}}

  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.vx*=.98;p.life--;if(p.life<=0)particles.splice(i,1)}

  if(stageTransition){stageTransition.timer--;if(stageTransition.timer<=0){const t=stageTransition;stageTransition=null;startStage(t.nextStage)}}
  else if(!bossActive&&enemies.length===0&&running){scheduleNextStage()}
}

function scheduleNextStage(){if(stageTransition)return;stageTransition={timer:90,nextStage:stage+1};if(stage%5===0){lives=Math.min(lives+1,5);updateHUD()}}
function loseLife(){if(player.invuln>0)return;lives--;updateHUD();player.invuln=90;screenShake=15;if(lives<=0)gameOver()}

function drawShip(x,y){
  if(player.invuln>0&&Math.floor(frame/4)%2===0)return;
  ctx.save();ctx.shadowBlur=20;ctx.shadowColor='#4ff';ctx.fillStyle='#4ff';
  ctx.beginPath();ctx.moveTo(x+player.w/2,y);ctx.lineTo(x+player.w,y+player.h);ctx.lineTo(x+player.w/2,y+player.h-8);ctx.lineTo(x,y+player.h);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+player.w/2,y+14,6,0,Math.PI*2);ctx.fill();
  const fl=8+Math.sin(frame*.5)*4;ctx.fillStyle='#ffd84f';
  ctx.beginPath();ctx.moveTo(x+10,y+player.h);ctx.lineTo(x+player.w/2,y+player.h+fl);ctx.lineTo(x+player.w-10,y+player.h);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawEnemy(e){
  ctx.save();ctx.translate(e.x+e.w/2,e.y+e.h/2+Math.sin(e.wobble)*3);
  ctx.shadowBlur=12;const col=e.type==='strong'?'#ff4f6b':'#7cff4f';ctx.shadowColor=col;ctx.fillStyle=col;
  ctx.beginPath();ctx.ellipse(0,0,e.w/2,e.h/2,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-6,5,0,Math.PI*2);ctx.arc(8,-6,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-8,-5,2.5,0,Math.PI*2);ctx.arc(8,-5,2.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,4,6,0,Math.PI);ctx.stroke();
  if(e.maxHp>1){ctx.fillStyle='#0008';ctx.fillRect(-e.w/2,-e.h/2-8,e.w,4);ctx.fillStyle='#ffd84f';ctx.fillRect(-e.w/2,-e.h/2-8,e.w*(e.hp/e.maxHp),4)}
  ctx.restore();
}
function drawBoss(b){
  ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);
  const pulse=1+Math.sin(b.wobble*3)*.04;ctx.scale(pulse,pulse);
  ctx.shadowBlur=30;ctx.shadowColor='#ff0040';
  ctx.fillStyle='#8b0030';ctx.beginPath();ctx.moveTo(0,-b.h/2);ctx.lineTo(b.w/2,0);ctx.lineTo(b.w/3,b.h/2);ctx.lineTo(0,b.h/3);ctx.lineTo(-b.w/3,b.h/2);ctx.lineTo(-b.w/2,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff4f6b';ctx.beginPath();ctx.ellipse(0,-5,b.w/3,b.h/3,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=15;ctx.shadowColor='#ffd84f';ctx.fillStyle='#ffd84f';ctx.beginPath();ctx.arc(-22,-12,10,0,Math.PI*2);ctx.arc(22,-12,10,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-22+b.dir*3,-12,5,0,Math.PI*2);ctx.arc(22+b.dir*3,-12,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.moveTo(-28,18);
  for(let i=0;i<6;i++){const x1=-28+i*(56/6),x2=x1+(56/12);ctx.lineTo(x1,18);ctx.lineTo(x2,28)}
  ctx.lineTo(28,18);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';
  for(let i=0;i<6;i++){const x=-26+i*10;ctx.beginPath();ctx.moveTo(x,18);ctx.lineTo(x+4,24);ctx.lineTo(x+8,18);ctx.closePath();ctx.fill()}
  ctx.restore();
  ctx.save();const bw=b.w,bh=8,bx=b.x,by=b.y-18;
  ctx.fillStyle='#0008';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle='#ff4f6b';ctx.fillRect(bx,by,bw*(b.hp/b.maxHp),bh);
  ctx.strokeStyle='#fff8';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
  ctx.restore();
}
function draw(){
  ctx.save();
  if(screenShake>.5)ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,bossActive?'#1a0010':'#05060f');
  grad.addColorStop(1,bossActive?'#2a0020':'#0f0b2e');
  ctx.fillStyle=grad;ctx.fillRect(-50,-50,W+100,H+100);
  stars.forEach(s=>{ctx.fillStyle='rgba(255,255,255,'+(0.3+s.s*0.3)+')';ctx.fillRect(s.x,s.y,s.s,s.s)});
  enemyBullets.forEach(b=>{ctx.save();ctx.shadowBlur=12;
    if(b.type==='boss'){ctx.shadowColor=b.color||'#ff4f6b';ctx.fillStyle=b.color||'#ff4f6b';ctx.beginPath();ctx.arc(b.x+b.w/2,b.y+b.h/2,b.w/2,0,Math.PI*2);ctx.fill()}
    else{ctx.shadowColor='#ffd84f';ctx.fillStyle='#fff8e0';ctx.beginPath();ctx.ellipse(b.x+b.w/2,b.y+b.h/2,b.w/2,b.h/2,0,0,Math.PI*2);ctx.fill()}
    ctx.restore()});
  enemies.forEach(drawEnemy);
  if(bossActive&&boss)drawBoss(boss);
  bullets.forEach(b=>{ctx.save();ctx.shadowBlur=15;ctx.shadowColor='#4ff';ctx.fillStyle='#aaffff';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.restore()});
  if(running)drawShip(player.x,player.y);
  particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)});
  ctx.globalAlpha=1;
  ctx.restore();
}
function loop(){update();draw();requestAnimationFrame(loop)}

function gameOver(){
  running=false;
  overlay.querySelector('h2').textContent='💥 خسرت!';
  overlay.querySelector('p').innerHTML='نقاطك: <b style="color:#4ff">'+score+'</b><br>وصلت للمرحلة: <b style="color:#ffd84f">'+stage+'</b>';
  startBtn.textContent='العب تاني 🔁';
  overlay.classList.remove('hidden');
  bossBar.style.display='none';
}
startBtn.addEventListener('click',()=>{overlay.classList.add('hidden');initGame();startStage(1)});

resizeCanvas();
initGame();
running=false;
loop();
</script>
</body>
  </html>
